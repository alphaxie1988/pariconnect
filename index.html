<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pariconnect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .status-section {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 25px;
            margin: 30px 0;
            border-left: 4px solid #667eea;
        }
        
        .status-label {
            color: #999;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.2em;
            margin: 10px 0;
            transition: all 0.3s ease;
        }
        
        .status-badge.running {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .status-badge.not-running {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        
        .status-badge.loading {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        
        .status-badge.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1em;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 10px;
            border: none;
            cursor: pointer;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .status-info {
            font-size: 0.85em;
            color: #999;
            margin-top: 15px;
            text-align: left;
            background: white;
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .debug-box {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 0.75em;
            color: #333;
            word-break: break-all;
            white-space: pre-wrap;
        }
        
        .error-box {
            background: #fee;
            border: 1px solid #fcc;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 0.75em;
            color: #c33;
            word-break: break-all;
            white-space: pre-wrap;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffc107;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Pariconnect</h1>
        <p>Connect, collaborate, and create amazing things together.</p>
        
        <div class="status-section">
            <div class="status-label">Service Status</div>
            <div id="statusContainer">
                <div class="status-badge loading">
                    <span class="spinner"></span>Checking Status...
                </div>
            </div>
            <div class="status-info" id="statusInfo"></div>
            <div class="debug-box" id="debugInfo" style="display:none; margin-top: 15px;">
                <strong>Debug Info:</strong><br/>
                <div id="debugContent"></div>
            </div>
        </div>
        
        <button class="button" onclick="checkStatus()">Refresh Status</button>
        <button class="button" onclick="toggleDebug()" style="background: #666;">Toggle Debug</button>
        <a href="https://github.com/alphaxie1988/pariconnect" class="button">Visit Repository</a>
    </div>

    <script>
        const API_URL = 'https://pariconnect.shares.zrok.io/status';
        let debugMode = false;
        let debugLog = [];
        
        function addDebugLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            debugLog.push(`[${timestamp}] ${message}`);
            const debugContent = document.getElementById('debugContent');
            debugContent.textContent = debugLog.join('\n');
        }
        
        function toggleDebug() {
            debugMode = !debugMode;
            document.getElementById('debugInfo').style.display = debugMode ? 'block' : 'none';
        }
        
        async function checkStatus() {
            const statusContainer = document.getElementById('statusContainer');
            const statusInfo = document.getElementById('statusInfo');
            debugLog = [];
            
            try {
                // Show loading state
                statusContainer.innerHTML = '<div class="status-badge loading"><span class="spinner"></span>Checking Status...</div>';
                statusInfo.innerHTML = '';
                addDebugLog('Starting status check...');
                addDebugLog('API URL: ' + API_URL);
                
                // Fetch with custom headers to skip zrok interstitial and cache busting
                addDebugLog('Sending fetch request with custom headers...');
                const timestamp = new Date().getTime();
                const response = await fetch(API_URL + '?t=' + timestamp, {
                    method: 'GET',
                    headers: {
                        'skip_zrok_interstitial': 'true',
                        'Z-skip-interstitial': 'true',
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0'
                    },
                    credentials: 'omit',
                    cache: 'no-store'
                });
                
                addDebugLog('Response received');
                addDebugLog('Status: ' + response.status);
                addDebugLog('Status Text: ' + response.statusText);
                addDebugLog('OK: ' + response.ok);
                
                // Check if response is ok
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                addDebugLog('Response JSON parsed successfully');
                addDebugLog('Full Response: ' + JSON.stringify(data, null, 2));
                
                // Check what fields are in the response
                addDebugLog('Response keys: ' + Object.keys(data).join(', '));
                addDebugLog('Response.running: ' + data.running);
                
                // Handle the status response - check for "running" field
                const isRunning = data.running === true;
                addDebugLog('isRunning: ' + isRunning);
                
                const badgeClass = isRunning ? 'running' : 'not-running';
                const badgeText = isRunning ? '✓ Running' : '✗ Not Running';
                const statusEmoji = isRunning ? '🟢' : '🔴';
                
                statusContainer.innerHTML = `<div class="status-badge ${badgeClass}">${statusEmoji} ${badgeText}</div>`;
                statusInfo.innerHTML = `
                    <div style="font-size: 0.8em; margin-top: 5px;">Last checked: ${new Date().toLocaleTimeString()}</div>
                    <div style="font-size: 0.75em; color: #666; margin-top: 5px;">
                        <strong>Running:</strong> ${isRunning ? 'Yes ✓' : 'No ✗'}
                    </div>
                `;
                
                addDebugLog('✅ Status check completed successfully');
                
            } catch (error) {
                addDebugLog('❌ ERROR CAUGHT');
                addDebugLog('Error Type: ' + error.name);
                addDebugLog('Error Message: ' + error.message);
                addDebugLog('Error Stack: ' + error.stack);
                
                statusContainer.innerHTML = '<div class="status-badge error">⚠ Unable to Connect</div>';
                statusInfo.innerHTML = `
                    <div><strong>Error Details:</strong></div>
                    <div class="error-box">
                        <strong>Error Type:</strong> ${error.name}<br/>
                        <strong>Error Message:</strong> ${error.message}<br/>
                        <strong>API URL:</strong> ${API_URL}<br/>
                        <strong>Time:</strong> ${new Date().toLocaleTimeString()}<br/>
                        <br/>
                        <strong>Possible causes:</strong><br/>
                        • API server is down or unreachable<br/>
                        • CORS policy is blocking the request<br/>
                        • Network connectivity issue<br/>
                        • Browser security policy<br/>
                        <br/>
                        📱 <strong>Click "Toggle Debug" button above to see detailed logs</strong>
                    </div>
                `;
            }
            
            // Auto-show debug info if there's an error
            if (debugMode || debugLog.some(log => log.includes('ERROR'))) {
                document.getElementById('debugInfo').style.display = 'block';
            }
        }
        
        // Check status when page loads
        document.addEventListener('DOMContentLoaded', checkStatus);
        
        // Optional: Refresh status every 30 seconds
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
