<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pariconnect</title>
    <link rel="icon" type="image/svg+xml" href="https://app.pariconnect.com/images/PARiConnect%20Logo.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        
        .logo {
            max-width: 220px;
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .status-section {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 25px;
            margin: 30px 0;
            border-left: 4px solid #012d6a;
            transition: border-color 0.3s ease;
        }

        .status-section.running {
            border-left-color: #4caf50;
        }

        .status-label {
            color: #012d6a;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .status-section.running .status-label {
            color: #1b5e20;
        }
        
        .status-badge {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1.1em;
            margin: 10px 0;
            transition: all 0.3s ease;
        }
        
        .status-badge.running {
            background: #e8f5e9;
            color: #1b5e20;
            border: 2px solid #4caf50;
        }
        
        .status-badge.not-running {
            background: #f0f0f0;
            color: #555555;
            border: 2px solid #9e9e9e;
        }
        
        .status-badge.loading {
            background: #e3f2fd;
            color: #012d6a;
            border: 2px solid #012d6a;
        }
        
        .status-badge.error {
            background: #ffebee;
            color: #b71c1c;
            border: 2px solid #f44336;
        }
        
        .status-info {
            font-size: 0.9em;
            color: #666;
            margin-top: 12px;
            min-height: 1.3em;
        }
        
        .buttons-section {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 25px;
        }
        
        .button {
            display: inline-block;
            position: relative;
            overflow: hidden;
            background: #012d6a;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(1, 45, 106, 0.2);
        }

        .confirm-progress {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 3px;
            width: 0%;
            background: rgba(255, 255, 255, 0.7);
        }
        
        .button:hover {
            background: #0a1f47;
            box-shadow: 0 4px 12px rgba(1, 45, 106, 0.3);
            transform: translateY(-2px);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .button.secondary {
            background: white;
            color: #012d6a;
            border: 2px solid #012d6a;
            box-shadow: none;
        }
        
        .button.secondary:hover {
            background: #f0f0f0;
        }

        /* Danger/stop button style */
        .button.danger {
            background: #b71c1c;
            color: white;
            box-shadow: 0 2px 8px rgba(183,28,28,0.18);
        }

        .button.danger:hover {
            background: #8f1414;
            box-shadow: 0 4px 12px rgba(183,28,28,0.25);
            transform: translateY(-2px);
        }
        
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .button.hidden {
            display: none;
        }
        
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(1, 45, 106, 0.3);
            border-top: 2px solid #012d6a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            background: #e8f5e9;
            color: #1b5e20;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            border-left: 4px solid #4caf50;
            font-size: 0.9em;
        }

        .error-message {
            background: #ffebee;
            color: #b71c1c;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            border-left: 4px solid #f44336;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="https://app.pariconnect.com/images/PARiConnect%20Logo.svg" alt="PARiConnect logo">
        <p>Creating Connections. Changing Lives.</p>
        
        <div class="status-section" id="statusSection">
            <div class="status-label">Service Status</div>
            <div id="statusContainer">
                <div class="status-badge loading">
                    <span class="spinner"></span>Checking Status...
                </div>
            </div>
            <div class="status-info" id="statusInfo"></div>
            <div id="statusMessage"></div>
        </div>
        
        <div class="buttons-section">
            <button class="button secondary" onclick="checkStatus()">Check Status</button>
            <button id="runServiceBtn" class="button hidden" onclick="runService(event)">Run Service</button>
            <button id="stopServiceBtn" class="button danger hidden" onclick="stopService(event)"><span class="btn-label">Stop Service</span><span class="confirm-progress"></span></button>
        </div>
    </div>

    <script>
        const STATUS_URL = 'https://pariconnect.shares.zrok.io/status';
        const RUN_URL = 'https://pariconnect.shares.zrok.io/start';
        const STOP_URL = 'https://pariconnect.shares.zrok.io/stop';
        const HEADERS = {
            'skip_zrok_interstitial': 'true',
            'Z-skip-interstitial': 'true',
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
        };
        
        function setActionButtons(isRunning) {
            const runBtn = document.getElementById('runServiceBtn');
            const stopBtn = document.getElementById('stopServiceBtn');
            const statusSection = document.getElementById('statusSection');
            statusSection.classList.toggle('running', isRunning === true);

            if (isRunning === true) {
                runBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
            } else if (isRunning === false) {
                runBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                resetStopConfirm(stopBtn);
            } else {
                // Status unknown - keep both hidden rather than flash the wrong one
                runBtn.classList.add('hidden');
                stopBtn.classList.add('hidden');
                resetStopConfirm(stopBtn);
            }
        }

        async function checkStatus() {
            const statusContainer = document.getElementById('statusContainer');
            const statusInfo = document.getElementById('statusInfo');
            const statusMessage = document.getElementById('statusMessage');

            try {
                statusContainer.innerHTML = '<div class="status-badge loading"><span class="spinner"></span>Checking Status...</div>';
                statusInfo.innerHTML = '';
                statusMessage.innerHTML = '';

                const timestamp = new Date().getTime();
                const response = await fetch(STATUS_URL + '?t=' + timestamp, {
                    method: 'GET',
                    headers: HEADERS,
                    credentials: 'omit',
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const isRunning = data.running === true;

                const badgeClass = isRunning ? 'running' : 'not-running';
                const badgeText = isRunning ? 'Running' : 'Not Running';

                statusContainer.innerHTML = `<div class="status-badge ${badgeClass}">${badgeText}</div>`;
                statusInfo.innerHTML = `<div>Last checked: ${new Date().toLocaleTimeString()}</div>`;
                setActionButtons(isRunning);

            } catch (error) {
                statusContainer.innerHTML = '<div class="status-badge error">⚠ Unable to Connect</div>';
                statusInfo.innerHTML = `<div>${error.message}</div>`;
                statusMessage.innerHTML = `<div class="error-message">Failed to check status. Please try again.</div>`;
                setActionButtons(null);
            }
        }
        
        async function runService(event) {
            const statusContainer = document.getElementById('statusContainer');
            const statusMessage = document.getElementById('statusMessage');
            
            try {
                statusMessage.innerHTML = '';
                const button = event.target;
                button.disabled = true;
                button.innerHTML = '<span class="spinner"></span>Running...';
                
                const timestamp = new Date().getTime();
                const response = await fetch(RUN_URL + '?t=' + timestamp, {
                    method: 'GET',
                    headers: HEADERS,
                    credentials: 'omit',
                    cache: 'no-store'
                });
                
                button.innerHTML = 'Run Service';
                button.disabled = false;
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                // show a friendly success message (server may also return details)
                statusMessage.innerHTML = `<div class="success-message">✓ Service started successfully</div>`;
                
                // Check status after 2 seconds
                setTimeout(checkStatus, 2000);
                
            } catch (error) {
                const button = event.target;
                button.innerHTML = 'Run Service';
                button.disabled = false;
                
                statusMessage.innerHTML = `<div class="error-message">✗ Failed to run service: ${error.message}</div>`;
            }
        }

        const STOP_BTN_IDLE_HTML = '<span class="btn-label">Stop Service</span><span class="confirm-progress"></span>';
        const STOP_CONFIRM_MS = 3000;
        let stopConfirmTimeout = null;

        function resetStopConfirm(button) {
            clearTimeout(stopConfirmTimeout);
            button.dataset.armed = 'false';
            button.innerHTML = STOP_BTN_IDLE_HTML;
        }

        async function stopService(event) {
            const button = event.currentTarget;

            if (button.dataset.armed !== 'true') {
                // First click: arm the button and wait for a confirming second click
                button.dataset.armed = 'true';
                const label = button.querySelector('.btn-label');
                const bar = button.querySelector('.confirm-progress');
                label.textContent = 'Confirm Stop?';
                // Reset the bar instantly, then transition it down to 0 over the confirm window
                bar.style.transition = 'none';
                bar.style.width = '100%';
                void bar.offsetWidth;
                bar.style.transition = `width ${STOP_CONFIRM_MS}ms linear`;
                bar.style.width = '0%';

                clearTimeout(stopConfirmTimeout);
                stopConfirmTimeout = setTimeout(() => resetStopConfirm(button), STOP_CONFIRM_MS);
                return;
            }

            // Second click within the window: proceed with the actual stop
            resetStopConfirm(button);

            const statusMessage = document.getElementById('statusMessage');

            try {
                statusMessage.innerHTML = '';
                button.disabled = true;
                button.innerHTML = '<span class="spinner"></span>Stopping...';

                const timestamp = new Date().getTime();
                const response = await fetch(STOP_URL + '?t=' + timestamp, {
                    method: 'GET',
                    headers: HEADERS,
                    credentials: 'omit',
                    cache: 'no-store'
                });

                button.innerHTML = STOP_BTN_IDLE_HTML;
                button.disabled = false;

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                // The API replies {"success": true, "message": "Pariconnect stopped."}
                if (data && data.success) {
                    statusMessage.innerHTML = `<div class="success-message">✓ ${data.message || 'Service stopped.'}</div>`;
                } else {
                    // If the API did not indicate success, show fallback
                    statusMessage.innerHTML = `<div class="error-message">✗ Failed to stop service${data && data.message ? (': ' + data.message) : '.'}</div>`;
                }

                // Check status after 2 seconds
                setTimeout(checkStatus, 2000);

            } catch (error) {
                button.innerHTML = STOP_BTN_IDLE_HTML;
                button.disabled = false;

                statusMessage.innerHTML = `<div class="error-message">✗ Failed to stop service: ${error.message}</div>`;
            }
        }
        
        // Check status when page loads
        document.addEventListener('DOMContentLoaded', checkStatus);
        
        // Refresh status every 30 seconds
        setInterval(checkStatus, 30000);
    </script>
</body>
</html>
